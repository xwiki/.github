## Validate the Renovate presets on every change: the xwiki repositories and, through the xwiki-contrib
## preset extending them, every xwiki-contrib repository use them, and Renovate does not report an
## invalid preset anywhere visible, it just stops working on all of them. --strict also fails on a
## deprecated option that Renovate would otherwise silently migrate.
name: Renovate configuration

on:
  push:
    paths:
      - 'renovate/**'
      - '.github/workflows/renovate-config.yml'
  pull_request:
    paths:
      - 'renovate/**'
      - '.github/workflows/renovate-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Validate the presets
        run: npx --yes --package renovate@44 -- renovate-config-validator --strict --no-global renovate/*.json5
